<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Анализатор чертежного шрифта ГОСТ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #0a0d10;
      --bg-card: #13171d;
      --bg-subcard: #1a2028;
      --border-color: rgba(255, 255, 255, 0.07);
      --text-main: #f8fafc;
      --text-muted: #8492a6;
      --accent-emerald: #10b981;
      --accent-blue: #38bdf8;
      --accent-purple: #c084fc;
      --accent-amber: #fbbf24;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      min-height: 100vh;
      padding: 2rem 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .app-container {
      max-width: 800px;
      width: 100%;
    }

    .header {
      margin-bottom: 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .header h1 {
      font-size: 1.85rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .badge-gost {
      display: inline-flex;
      align-items: center;
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--accent-emerald);
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.28);
      padding: 0.38rem 0.85rem;
      border-radius: 9999px;
      letter-spacing: 0.04em;
    }

    .control-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 1.6rem;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.2);
      margin-bottom: 2rem;
    }

    .input-group {
      margin-bottom: 1.25rem;
    }

    .input-label {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 0.5rem;
      display: block;
    }

    .form-control {
      width: 100%;
      background: var(--bg-subcard);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 600;
      padding: 0.85rem 1rem;
      border-radius: 12px;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-control:focus {
      border-color: var(--accent-blue);
    }

    textarea.form-control {
      resize: vertical;
      min-height: 100px;
      font-weight: 500;
      line-height: 1.5;
    }

    .checkbox-wrap {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
      cursor: pointer;
    }

    .checkbox-wrap input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: var(--accent-emerald);
      cursor: pointer;
    }

    .checkbox-label {
      font-size: 0.92rem;
      font-weight: 600;
      color: var(--text-main);
      cursor: pointer;
    }

    .btn-submit {
      width: 100%;
      background: var(--accent-emerald);
      color: #042f2e;
      padding: 0.85rem 1rem;
      border-radius: 12px;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      border: none;
      transition: all 0.2s ease;
    }

    .btn-submit:hover {
      background: #34d399;
      transform: translateY(-1px);
    }

    /* Output Grid */
    .output-container {
      display: flex;
      flex-direction: column;
      gap: 1.4rem;
    }

    .result-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 18px;
      padding: 1.35rem 1.15rem;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.15rem;
      padding-bottom: 0.8rem;
      border-bottom: 1px solid var(--border-color);
    }

    .card-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .tag-badge {
      font-size: 0.7rem;
      font-weight: 800;
      padding: 0.3rem 0.6rem;
      border-radius: 8px;
      text-transform: uppercase;
    }

    .tag-blue { background: rgba(56, 189, 248, 0.15); color: var(--accent-blue); }
    .tag-emerald { background: rgba(16, 185, 129, 0.15); color: var(--accent-emerald); }
    .tag-purple { background: rgba(192, 132, 252, 0.15); color: var(--accent-purple); }
    .tag-amber { background: rgba(251, 191, 36, 0.15); color: var(--accent-amber); }

    .word-list {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      margin-bottom: 1rem;
    }

    .word-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg-subcard);
      padding: 0.65rem 1rem;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.03);
    }

    .word-text { font-weight: 600; font-size: 0.95rem; }
    .word-size { font-size: 0.85rem; color: var(--text-muted); font-weight: 600; }
    .word-size span { color: var(--accent-blue); }

    .kardio-box {
      background: #0f1318;
      border: 1px solid var(--border-color);
      padding: 1rem;
      border-radius: 10px;
      font-family: 'Fira Code', monospace;
      font-size: 0.8rem;
      color: var(--text-muted);
      line-height: 1.6;
      word-break: break-all;
    }

    .kardio-label {
      display: block;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-bottom: 0.5rem;
    }

    .summary-card {
      background: rgba(16, 185, 129, 0.04);
      border-color: rgba(16, 185, 129, 0.3);
    }
  </style>
</head>
<body>

  <div class="app-container">
    <header class="header">
      <h1>Шрифт ГОСТ</h1>
      <span class="badge-gost">Тип Б (2.304-81)</span>
    </header>

    <main>
      <div class="control-card">
        <div class="input-group">
          <label class="input-label">Размер шрифта (h)</label>
          <select id="fontSize" class="form-control">
            <option value="2.5">2.5 мм</option>
            <option value="3.5">3.5 мм</option>
            <option value="5">5.0 мм</option>
            <option value="7" selected>7.0 мм</option>
            <option value="10">10.0 мм</option>
          </select>
        </div>

        <div class="input-group">
          <label class="input-label">Текст для чертежа</label>
          <!-- Теперь можно делать переносы прямо кнопкой Enter или писать \ -->
          <textarea id="textInput" class="form-control" placeholder="Теоретический&#10;чертеж крыла"></textarea>
        </div>

        <label class="checkbox-wrap">
          <input type="checkbox" id="showKardio" checked>
          <span class="checkbox-label">Показать разбор (кардиограмму)</span>
        </label>

        <button onclick="analyzeText()" class="btn-submit">ВЫПОЛНИТЬ АНАЛИЗ</button>
      </div>

      <div id="outputContainer" class="output-container"></div>
    </main>
  </div>

  <script>
    // Тот самый словарь
    const all_fonts = {
        "2.5": {
            "system": [2.5, 1.8, 1.5, 4.0, 0.5],
            "А": 1.8, "Б": 1.5, "В": 1.5, "Г": 1.25, "Д": 1.8, "Е": 1.25, "Ё": 1.25, "Ж": 2, "З": 1.25, "И": 1.5, "Й": 1.5, "К": 1.5, "Л": 1.5, "М": 1.8, "Н": 1.5, "О": 1.5, "П": 1.5, "Р": 1.5, "С": 1.25, "Т": 1.5, "У": 1.5, "Ф": 2, "Х": 1.8, "Ц": 1.5, "Ч": 1.5, "Ш": 2, "Щ": 2, "Ъ": 2, "Ы": 1.8, "Ь": 1.5, "Э": 1.5, "Ю": 1.8, "Я": 1.5,
            "а": 1.25, "б": 1.25, "в": 1.25, "г": 1.25, "д": 1.25, "е": 1.25, "ё": 1.25, "ж": 1.8, "з": 1.25, "и": 1.25, "й": 1.25, "к": 1.25, "л": 1.25, "м": 1.5, "н": 1.25, "о": 1.25, "п": 1.25, "р": 1.25, "с": 1, "т": 1.8, "у": 1.25, "ф": 1.8, "х": 1.25, "ц": 1.25, "ч": 1.25, "ш": 1.8, "щ": 1.8, "ъ": 1.5, "ы": 1.5, "ь": 1.25, "э": 1.25, "ю": 1.5, "я": 1.25,
            "0": 1.25, "1": 0.75, "2": 1.25, "3": 1.25, "4": 1.25, "5": 1.25, "6": 1.25, "7": 1.25, "8": 1.25, "9": 1.25
        },
        "3.5": {
            "system": [3.5, 2.5, 2.1, 5.5, 0.7],
            "А": 2.5, "Б": 2, "В": 2, "Г": 1.75, "Д": 2.5, "Е": 1.75, "Ё": 1.75, "Ж": 2.8, "З": 1.75, "И": 2, "Й": 2, "К": 2, "Л": 2, "М": 2.5, "Н": 2, "О": 2, "П": 2, "Р": 2, "С": 1.75, "Т": 2, "У": 2, "Ф": 2.8, "Х": 2.5, "Ц": 2, "Ч": 2, "Ш": 2.8, "Щ": 2.8, "Ъ": 2.8, "Ы": 2.5, "Ь": 2, "Э": 2, "Ю": 2.5, "Я": 2,
            "а": 1.75, "б": 1.75, "в": 1.75, "г": 1.75, "д": 1.75, "е": 1.75, "ё": 1.75, "ж": 2.5, "з": 1.75, "и": 1.75, "й": 1.75, "к": 1.75, "л": 1.75, "м": 2.1, "н": 1.75, "о": 1.75, "п": 1.75, "р": 1.75, "с": 1.4, "т": 2.5, "у": 1.75, "ф": 2.5, "х": 1.75, "ц": 1.75, "ч": 1.75, "ш": 2.5, "щ": 2.5, "ъ": 2.1, "ы": 2.1, "ь": 1.75, "э": 1.75, "ю": 2.1, "я": 1.75,
            "0": 1.75, "1": 1, "2": 1.75, "3": 1.75, "4": 1.75, "5": 1.75, "6": 1.75, "7": 1.75, "8": 1.75, "9": 1.75
        },
        "5": {
            "system": [5, 3.5, 3, 8, 1],
            "А": 3.5, "Б": 3, "В": 3, "Г": 2.5, "Д": 3.5, "Е": 2.5, "Ё": 2.5, "Ж": 4, "З": 2.5, "И": 3, "Й": 3, "К": 3, "Л": 3, "М": 3.5, "Н": 3, "О": 3, "П": 3, "Р": 3, "С": 2.5, "Т": 3, "У": 3, "Ф": 4, "Х": 3.5, "Ц": 3, "Ч": 3, "Ш": 4, "Щ": 4, "Ъ": 4, "Ы": 3.5, "Ь": 3, "Э": 3, "Ю": 3.5, "Я": 3,
            "а": 2.5, "б": 2.5, "в": 2.5, "г": 2.5, "д": 2.5, "е": 2.5, "ё": 2.5, "ж": 3.5, "з": 2.5, "и": 2.5, "й": 2.5, "к": 2.5, "л": 2.5, "м": 3, "н": 2.5, "о": 2.5, "п": 2.5, "р": 2.5, "с": 2, "т": 3.5, "у": 2.5, "ф": 3.5, "х": 2.5, "ц": 2.5, "ч": 2.5, "ш": 3.5, "щ": 3.5, "ъ": 3, "ы": 3, "ь": 2.5, "э": 2.5, "ю": 3, "я": 2.5,
            "0": 2.5, "1": 1.5, "2": 2.5, "3": 2.5, "4": 2.5, "5": 2.5, "6": 2.5, "7": 2.5, "8": 2.5, "9": 2.5
        },
        "7": {
            "system": [7, 5, 4.2, 11, 1.4],
            "А": 5, "Б": 4.2, "В": 4.2, "Г": 3.5, "Д": 5, "Е": 3.5, "Ё": 3.5, "Ж": 5.6, "З": 3.5, "И": 4.2, "Й": 4.2, "К": 4.2, "Л": 4.2, "М": 5, "Н": 4.2, "О": 4.2, "П": 4.2, "Р": 4.2, "С": 3.5, "Т": 4.2, "У": 4.2, "Ф": 5.6, "Х": 5, "Ц": 4.2, "Ч": 4.2, "Ш": 5.6, "Щ": 5.6, "Ъ": 5.6, "Ы": 5, "Ь": 4.2, "Э": 4.2, "Ю": 5, "Я": 4.2,
            "а": 3.5, "б": 3.5, "в": 3.5, "г": 3.5, "д": 3.5, "е": 3.5, "ё": 3.5, "ж": 5, "з": 3.5, "и": 3.5, "й": 3.5, "к": 3.5, "л": 3.5, "м": 4.2, "н": 3.5, "о": 3.5, "п": 3.5, "р": 3.5, "с": 2.8, "т": 5, "у": 3.5, "ф": 5, "х": 3.5, "ц": 3.5, "ч": 3.5, "ш": 5, "щ": 5, "ъ": 4.2, "ы": 4.2, "ь": 3.5, "э": 3.5, "ю": 4.2, "я": 3.5,
            "0": 3.5, "1": 2, "2": 3.5, "3": 3.5, "4": 3.5, "5": 3.5, "6": 3.5, "7": 3.5, "8": 3.5, "9": 3.5
        },
        "10": {
            "system": [10, 7, 6, 16, 2],
            "А": 7, "Б": 6, "В": 6, "Г": 5, "Д": 7, "Е": 5, "Ё": 5, "Ж": 8, "З": 5, "И": 6, "Й": 6, "К": 6, "Л": 6, "М": 7, "Н": 6, "О": 6, "П": 6, "Р": 6, "С": 5, "Т": 6, "У": 6, "Ф": 8, "Х": 7, "Ц": 6, "Ч": 6, "Ш": 8, "Щ": 8, "Ъ": 8, "Ы": 7, "Ь": 6, "Э": 6, "Ю": 7, "Я": 6,
            "а": 5, "б": 5, "в": 5, "г": 5, "д": 5, "е": 5, "ё": 5, "ж": 7, "з": 5, "и": 5, "й": 5, "к": 5, "л": 5, "м": 6, "н": 5, "о": 5, "п": 5, "р": 5, "с": 4, "т": 7, "у": 5, "ф": 7, "х": 5, "ц": 5, "ч": 5, "ш": 7, "щ": 7, "ъ": 6, "ы": 6, "ь": 5, "э": 5, "ю": 6, "я": 5,
            "0": 5, "1": 3, "2": 5, "3": 5, "4": 5, "5": 5, "6": 5, "7": 5, "8": 5, "9": 5
        }
    };

    function analyzeText() {
      const fontSize = document.getElementById("fontSize").value;
      const font = all_fonts[fontSize];
      const rawText = document.getElementById("textInput").value;
      const makeKardio = document.getElementById("showKardio").checked;
      const outputDiv = document.getElementById("outputContainer");

      // 1. НАДЁЖНАЯ ОЧИСТКА ВВОДА:
      // Убираем скрытые возвраты каретки (\r)
      // Заменяем \ или \\ на нормальный перенос строки \n
      let cleanText = rawText.replace(/\r/g, '');
      cleanText = cleanText.replace(/\\+/g, '\n');

      if (!cleanText.trim()) {
        outputDiv.innerHTML = `
          <div class="result-card" style="border-color: var(--accent-amber);">
            <div class="card-title" style="color: var(--accent-amber); text-align: center;">Ошибка: Введите текст для расчета</div>
          </div>`;
        return;
      }

      const RASSTOYANIE = font["system"][4];
      const PROBEL = font["system"][2];
      const RASSTOYANIE_VYSOTA = font["system"][3];

      const lines = cleanText.split('\n');
      let htmlOutput = "";
      let lineLengths = [];

      lines.forEach((line, lineIndex) => {
        if (line.trim() === "") return;

        // 2. РАЗБИВКА СЛОВ (Игнорирует двойные-тройные пробелы, считая их одним разделителем)
        let words = line.trim().split(/\s+/);
        let dlina_stroki = 0;
        let kardiogramma = "";
        let wordItemsHtml = "";

        words.forEach((word, wordIndex) => {
          let count = 0;
          
          for (let char of word) {
            // Если символа нет в словаре, его ширина считается как 0
            let charWidth = font[char] !== undefined ? font[char] : 0;
            count += charWidth;
            kardiogramma += `/ (${char})${charWidth} /`;
          }

          if (word.length > 1) {
            count += (word.length - 1) * RASSTOYANIE;
          }
          dlina_stroki += count;

          wordItemsHtml += `
            <div class="word-item">
              <span class="word-text">${word}</span>
              <span class="word-size"><span>${count.toFixed(2)}</span> мм</span>
            </div>`;

          if (wordIndex < words.length - 1) {
            kardiogramma += ` __(${PROBEL})__ `;
          }
        });

        if (words.length > 1) {
          dlina_stroki += (words.length - 1) * PROBEL;
        }

        kardiogramma = kardiogramma.replace(/\/\//g, `/ ${RASSTOYANIE} /`);
        lineLengths.push(dlina_stroki);

        htmlOutput += `
          <div class="result-card">
            <div class="card-header">
              <span class="card-title">Строка ${lineIndex + 1}</span>
              <span class="tag-badge tag-blue">L = ${dlina_stroki.toFixed(2)} мм</span>
            </div>
            <div class="word-list">
              ${wordItemsHtml}
            </div>
            ${makeKardio ? `
              <span class="kardio-label">Схематичное представление:</span>
              <div class="kardio-box">${kardiogramma}</div>
            ` : ''}
          </div>
        `;
      });

      if (lineLengths.length === 0) return;

      const maxLen = Math.max(...lineLengths);
      
      htmlOutput += `
        <div class="result-card summary-card">
          <div class="card-header" style="border-bottom: none; margin-bottom: 0; padding-bottom: 0;">
            <span class="card-title" style="color: var(--accent-emerald);">Суммарная ширина:</span>
            <span class="tag-badge tag-emerald">${maxLen.toFixed(2)} мм</span>
          </div>
      `;

      if (lineLengths.length > 1) {
        const vysota = parseFloat(fontSize) + ((lineLengths.length - 1) * RASSTOYANIE_VYSOTA);
        htmlOutput += `
          <div class="card-header" style="border-bottom: none; margin-bottom: 0; padding-bottom: 0; margin-top: 1rem;">
            <span class="card-title" style="color: var(--accent-purple); font-size: 1rem;">Общая высота текстового блока:</span>
            <span class="tag-badge tag-purple">${vysota.toFixed(2)} мм</span>
          </div>
        `;
      }

      htmlOutput += `</div>`;
      outputDiv.innerHTML = htmlOutput;
    }
  </script>
</body>
</html>
